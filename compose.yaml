name: etl-pet

x-airflow-common: &airflow-common
  build:
    context: ./infra/airflow
  image: etl-pet-airflow:3.3.0
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    ETL_PROJECT_ROOT: ${ETL_PROJECT_ROOT}
    PYTHONPATH: /opt/etl_pet/src
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    GREENPLUM_PASSWORD: ${GREENPLUM_PASSWORD}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    KINOPOISK_API_KEY: ${KINOPOISK_API_KEY:-}
    AIRFLOW_ALERT_EMAIL: ${AIRFLOW_ALERT_EMAIL:-}
    AIRFLOW_CONN_SMTP_ALERTS: ${AIRFLOW_CONN_SMTP_ALERTS:-}
    AIRFLOW__API__BASE_URL: ${AIRFLOW_PUBLIC_URL:-http://localhost:18080}
    AIRFLOW_CONN_MINIO_S3: '{"conn_type": "aws", "login": "${MINIO_ROOT_USER}", "password": "${MINIO_ROOT_PASSWORD}", "extra": {"endpoint_url": "http://minio:9000", "region_name": "us-east-1", "config_kwargs": {"s3": {"addressing_style": "path"}}}}'
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/etl_pet/src:ro
    - ./infra/clickhouse/sql:/opt/airflow/clickhouse:ro
  depends_on:
    airflow-db:
      condition: service_healthy

x-superset-common: &superset-common
  build:
    context: ./infra/superset
  image: etl-pet-superset:6.1.0
  environment: &superset-env
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
    SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:-}

x-dbt-image: &dbt-image
  build:
    context: ./infra/dbt
  image: etl-pet-dbt:1.10.2

x-dbt-common: &dbt-common
  <<: *dbt-image
  environment: &dbt-env
    DBT_PROFILES_DIR: /workspace/profiles
    GREENPLUM_HOST: greenplum
    GREENPLUM_PORT: "5432"
    GREENPLUM_USER: gpadmin
    GREENPLUM_PASSWORD: ${GREENPLUM_PASSWORD}
  working_dir: /workspace/dbt

services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-log-init:
    image: postgres:16-alpine
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if [ "$$(stat -c '%u:%g:%a' /logs)" = 0:0:755 ] && [ -z "$$(ls -A /logs)" ]; then
          chown "$${AIRFLOW_UID}:0" /logs
        fi
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    volumes:
      - ./airflow/logs:/logs

  airflow-init:
    <<: *airflow-common
    command: [python, /opt/airflow/deploy.py, record]
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    volumes:
      - ./airflow/logs:/opt/airflow/logs
      - ./infra/init/airflow_deploy.py:/opt/airflow/deploy.py:ro
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-log-init:
        condition: service_completed_successfully

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./src:/opt/etl_pet/src:ro
      - ./infra/clickhouse/sql:/opt/airflow/clickhouse:ro
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      airflow-dag-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-init:
    <<: *airflow-common
    command: [python, /opt/airflow/deploy.py, activate]
    volumes:
      - ./infra/init/airflow_deploy.py:/opt/airflow/deploy.py:ro
    depends_on:
      airflow-dag-processor:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      warehouse-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    entrypoint: [/bin/sh, /workspace/init/minio.sh]
    volumes:
      - ./infra/init/minio.sh:/workspace/init/minio.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_started

  spark-master:
    build:
      context: ./infra/spark
    image: etl-pet-spark:4.2.0
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.master.Master, --host, spark-master, --webui-port, "8080"]
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: [CMD, bash, -c, "echo > /dev/tcp/spark-master/7077"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  spark-worker:
    build:
      context: ./infra/spark
    image: etl-pet-spark:4.2.0
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.worker.Worker, --cores, "2", --memory, 4g, spark://spark-master:7077]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped

  spark-submit:
    build:
      context: ./infra/spark
    image: etl-pet-spark:4.2.0
    profiles: [tools]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      GREENPLUM_HOST: greenplum
      GREENPLUM_PORT: "5432"
      GREENPLUM_DATABASE: etl
      GREENPLUM_USER: gpadmin
      GREENPLUM_PASSWORD: ${GREENPLUM_PASSWORD}
    volumes:
      - ./spark/jobs:/workspace/spark/jobs:ro
    working_dir: /workspace/spark/jobs
    entrypoint: [/opt/spark/bin/spark-submit]

  greenplum:
    image: woblerr/greenplum:7.1.0
    hostname: greenplum
    shm_size: 2gb
    # gpstop has to finish before Docker sends SIGKILL (default is 10s).
    stop_grace_period: 2m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      GREENPLUM_PASSWORD: ${GREENPLUM_PASSWORD}
      GREENPLUM_DATABASE_NAME: etl
    ports:
      - "127.0.0.1:7000:5432"
    volumes:
      - greenplum-data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          source /usr/local/greenplum-db/greenplum_path.sh &&
          PGPASSWORD="$${GREENPLUM_PASSWORD}" psql -X -h 127.0.0.1 -U gpadmin -d etl
          -Atqc "SELECT count(*) FROM gp_dist_random('gp_id')"
          | grep -Eq '^[1-9][0-9]*$'
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.31.2
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      GREENPLUM_PASSWORD: ${GREENPLUM_PASSWORD}
      CLICKHOUSE_DB: mart
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9002:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/greenplum.xml:/etc/clickhouse-server/config.d/greenplum.xml:ro
      - ./infra/clickhouse/users.d/refresh.xml:/etc/clickhouse-server/users.d/refresh.xml:ro
      - ./infra/clickhouse/sql:/workspace/clickhouse:ro
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  warehouse-init:
    <<: *dbt-common
    entrypoint: [python, -u, /workspace/init/warehouse.py]
    command: [warehouse]
    environment:
      <<: *dbt-env
      DBT_TARGET_PATH: /tmp/dbt-target
      DBT_LOG_PATH: /tmp/dbt-target/logs
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./dbt:/workspace/dbt:ro
      - ./infra/dbt/profiles:/workspace/profiles:ro
      - ./infra/greenplum/sql:/workspace/greenplum:ro
      - ./infra/clickhouse/sql:/workspace/clickhouse:ro
      - ./infra/init/warehouse.py:/workspace/init/warehouse.py:ro
    depends_on:
      greenplum:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  superset-reader-init:
    <<: *dbt-image
    entrypoint: [python, -u, /workspace/init/warehouse.py]
    command: [reader]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:-}
    volumes:
      - ./infra/init/warehouse.py:/workspace/init/warehouse.py:ro
    depends_on:
      warehouse-init:
        condition: service_completed_successfully

  superset-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:-}
      POSTGRES_DB: superset
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, superset, -d, superset]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  superset-init:
    <<: *superset-common
    command: [python, /app/etl-pet/init.py]
    environment:
      <<: *superset-env
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-}
    depends_on:
      superset-db:
        condition: service_healthy
    healthcheck:
      disable: true

  superset:
    <<: *superset-common
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8088/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  superset-bootstrap:
    <<: *superset-common
    entrypoint: [python, -u, /app/etl-pet/scripts/bootstrap.py]
    command: []
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_ADMIN_USERNAME: admin
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-}
      SUPERSET_ASSETS_DIR: /app/etl-pet/assets
      AIRFLOW_URL: http://airflow-api-server:8080
      AIRFLOW_ADMIN_USERNAME: admin
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_DAG_ID: kinopoisk_movies_daily
      AIRFLOW_PUBLISH_TASK_ID: publish_clickhouse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_READER_USER: superset_reader
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:-}
      CLICKHOUSE_DATABASE: mart
      BI_BOOTSTRAP_TIMEOUT_SECONDS: ${BI_BOOTSTRAP_TIMEOUT_SECONDS:-7200}
    depends_on:
      superset:
        condition: service_healthy
      superset-reader-init:
        condition: service_completed_successfully
        # Report reader errors without interrupting Compose startup for the ETL.
        required: false
    healthcheck:
      disable: true

  dbt:
    <<: *dbt-common
    profiles: [tools]
    volumes:
      - ./dbt:/workspace/dbt
      - ./infra/dbt/profiles:/workspace/profiles:ro
    entrypoint: [dbt]

networks:
  default:
    name: etl-pet-net

volumes:
  airflow-db-data:
  minio-data:
  greenplum-data:
  clickhouse-data:
  superset-db-data:
