etl_pet:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('CLOUDBERRY_HOST') }}"
      port: "{{ env_var('CLOUDBERRY_PORT') | int }}"
      user: "{{ env_var('CLOUDBERRY_USER') }}"
      password: "{{ env_var('CLOUDBERRY_PASSWORD') }}"
      dbname: "{{ env_var('CLOUDBERRY_DATABASE', 'etl') }}"
      schema: core
      threads: 2
