etl_pet:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('GREENPLUM_HOST') }}"
      port: "{{ env_var('GREENPLUM_PORT') | int }}"
      user: "{{ env_var('GREENPLUM_USER') }}"
      password: "{{ env_var('GREENPLUM_PASSWORD') }}"
      dbname: "{{ env_var('GREENPLUM_DATABASE', 'etl') }}"
      schema: core
      threads: 2
