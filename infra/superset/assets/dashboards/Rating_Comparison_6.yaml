  MARKDOWN-xs05A5U09joe8iybFDrP5:
    children: []
    id: MARKDOWN-xs05A5U09joe8iybFDrP5
    meta:
      code: "## Research Findings\n\n**H1 \u2014 Systematic Rating Difference**\n\n\
        Kinopoisk ratings are higher than IMDb ratings for 71.9% of the 26,529 comparable\
        \ movies. The average signed difference is +0.38 points, supporting the hypothesis\
        \ of systematic rating differences between the platforms within the analyzed\
        \ sample.\n\n**H2 \u2014 Rating Disagreement by Release Decade**\n\nThe magnitude\
        \ and direction of rating differences vary across release decades. However,\
        \ differences in sample sizes should be considered when interpreting these\
        \ results.\n\n**H3 \u2014 Popularity and Rating Disagreement**\n\nThe hypothesis\
        \ that more popular movies have consistently smaller rating differences is\
        \ not supported by the observed data. Mean absolute differences vary between\
        \ 0.52 and 0.62 points across popularity groups without a consistent decreasing\
        \ pattern."
      height: 34
      width: 12
