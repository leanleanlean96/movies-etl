sql: "SELECT\n  movie_id,\n  name,\n  alternative_name,\n  production_year,\n  movie_length_minutes,\n\
  \  age_rating,\n  rating_mpaa,\n  CONCAT(ifNull(name, '\u0411\u0435\u0437 \u041D\
  \u0430\u0437\u0432\u0430\u043D\u0438\u044F'), ' [', toString(movie_id), ']') AS\
  \ movie_label,\n  FLOOR(production_year, -1) AS decade,\n  rating_kp,\n  votes_kp,\n\
  \  rating_imdb,\n  votes_imdb,\n  rating_tmdb,\n  votes_tmdb,\n  FLOOR(rating_kp)\
  \ AS rating_kp_bin,\n  observed_at\nFROM mart.mart_movie_scores_current"
