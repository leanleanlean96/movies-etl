table_name: bi_rating_comparison
main_dttm_col: null
currency_code_column: null
description: 'Contains movies with available ratings from both Kinopoisk and IMDb.


  Provides signed and absolute rating differences, rating intervals, release decades
  and popularity groups for cross-platform rating comparison.


  Grain: one row per movie.


  Logical primary key: movie_id.


  Source: mart.mart_movie_scores_current.


  Purpose: rating disagreement analysis and exploratory research.


  The dataset includes only movies available in the source data mart with non-null
  ratings from both platforms and does not represent the entire movie catalog.'
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: mart
sql: "SELECT\n    movie_id,\n    name,\n    production_year,\n    floor(production_year,\
  \ -1) AS decade,\n    rating_kp,\n    rating_imdb,\n    votes_kp,\n    votes_imdb,\n\
  \    rating_kp - rating_imdb AS rating_gap,\n    abs(rating_kp - rating_imdb) AS\
  \ absolute_gap,\n    toInt32(floor(rating_kp)) AS kp_bin,\n    toInt32(floor(rating_imdb))\
  \ AS imdb_bin,\n    toFloat64(floor((rating_kp - rating_imdb) * 2)) / 2 AS gap_bin,\n\
  \    multiIf(\n        votes_kp IS NULL, 'Unknown',\n        votes_kp < 1000, '<1K',\n\
  \        votes_kp < 5000, '1K-5K',\n        votes_kp < 10000, '5K-10K',\n      \
  \  votes_kp < 50000, '10K-50K',\n        votes_kp < 100000, '50K-100K',\n      \
  \  votes_kp < 500000, '100K-500K',\n        '500K+'\n    ) AS popularity_group,\n\
  \    multiIf(\n        votes_kp IS NULL, 8,\n        votes_kp < 1000, 1,\n     \
  \   votes_kp < 5000, 2,\n        votes_kp < 10000, 3,\n        votes_kp < 50000,\
  \ 4,\n        votes_kp < 100000, 5,\n        votes_kp < 500000, 6,\n        7\n\
  \    ) AS popularity_group_order\nFROM mart.mart_movie_scores_current\nWHERE rating_kp\
  \ IS NOT NULL\n    AND rating_imdb IS NOT NULL"
