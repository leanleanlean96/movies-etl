metrics:
- metric_name: valid_movies_count
  verbose_name: Valid Movies Count
  metric_type: null
  expression: "uniqExactIf(\n    movie_id,\n    is_complete_week AND isNotNull(votes_delta)\n\
    )"
  description: Number of distinct movies with at least one valid weekly observation
    within the selected period.
  d3format: ',.0f'
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: total_votes_delta
  verbose_name: Total Vote Change
  metric_type: null
  expression: "sumIf(\n    votes_delta,\n    is_complete_week AND isNotNull(votes_delta)\n\
    )"
  description: Total Kinopoisk vote change across valid weekly observations.
  d3format: +,.0f
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: avg_votes_delta
  verbose_name: Average Vote Change
  metric_type: null
  expression: "avgOrNullIf(votes_delta, \n    is_complete_week AND isNotNull(votes_delta))"
  description: Average Kinopoisk vote change per valid weekly observation.
  d3format: +,.1f
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: valid_observations_count
  verbose_name: Valid Observations Count
  metric_type: null
  expression: "countIf(\n    is_complete_week AND isNotNull(votes_delta)\n)"
  description: Number of observations eligible for complete-week vote change analysis.
  d3format: ',.0f'
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: valid_observations_coverage
  verbose_name: Valid Observations Coverage
  metric_type: null
  expression: countIf(is_complete_week AND isNotNull(votes_delta)) / nullIf(count(),
    0)
  description: Proportion of observations eligible for complete-week vote change analysis.
  d3format: .1%
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: period_votes_delta
  verbose_name: Period Vote Change
  metric_type: null
  expression: sumOrNull(votes_delta)
  description: Total Kinopoisk vote change across available observations, including
    incomplete weeks.
  d3format: +,.0f
  currency: null
  extra: {}
  warning_text: null
- metric_name: movies_count
  verbose_name: Movies Count
  metric_type: count
  expression: uniqExact(movie_id)
  description: Number of distinct movies within the selected period.
  d3format: ',.0f'
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: observations_count
  verbose_name: Observations Count
  metric_type: null
  expression: count()
  description: Number of movie-week observations.
  d3format: ',.0f'
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
