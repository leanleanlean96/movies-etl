[project]
name = "etl-pet"
version = "0.1.0"
description = "Local development environment for the ETL pet project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apache-airflow==3.3.0",
    "apache-airflow-providers-docker==4.5.7",
    "apache-airflow-providers-http==6.0.4",
    "boto3>=1.35,<2",
    "clickhouse-connect==1.4.1",
    "dbt-core==1.10.23",
    "dbt-postgres==1.10.2",
    "psycopg2-binary>=2.9,<3",
    "pyspark==4.2.0",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "spark/jobs"]
testpaths = ["tests"]

[tool.ruff.per-file-target-version]
# Spark containers use Python 3.10; local development uses Python 3.11.
"spark/jobs/*.py" = "py310"
"spark/jobs/kinopoisk_cleaned/*.py" = "py310"
